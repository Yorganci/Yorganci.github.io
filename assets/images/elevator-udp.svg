<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-label="Three processes: the floor subsystem and the elevator subsystem each exchange UDP messages with a multi-threaded scheduler"><style>.b{fill:#fbfaf6;stroke:#16181c;stroke-width:1.5}.k{fill:#16181c}.t{font:600 13px "IBM Plex Mono",monospace;fill:#16181c}.s{font:400 11px "IBM Plex Mono",monospace;fill:#686c73}.w{font:600 13px "IBM Plex Mono",monospace;fill:#f3f0e8}.a{stroke:#16181c;stroke-width:1.5;fill:none}.o{stroke:#d9480f;stroke-width:1.5;fill:none;stroke-dasharray:4 3}.os{font:400 11px "IBM Plex Mono",monospace;fill:#b23a0b}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16181c"/></marker></defs><rect class="b" x="10" y="70" width="160" height="80" rx="4"/><text class="t" x="90" y="104" text-anchor="middle">FLOOR SUBSYSTEM</text><text class="s" x="90" y="126" text-anchor="middle">buttons · lamps · riders</text><rect class="k" x="240" y="60" width="160" height="100" rx="4"/><text class="w" x="320" y="100" text-anchor="middle">SCHEDULER</text><text class="s" x="320" y="122" text-anchor="middle" style="fill:#bdb5a4">multi-threaded</text><text class="s" x="320" y="140" text-anchor="middle" style="fill:#bdb5a4">assigns cars</text><rect class="b" x="470" y="70" width="160" height="80" rx="4"/><text class="t" x="550" y="104" text-anchor="middle">ELEVATOR SUBSYSTEM</text><text class="s" x="550" y="126" text-anchor="middle">cars · doors · motors</text><path class="a" d="M170 98H238" marker-end="url(#ah)"/><path class="a" d="M240 122H172" marker-end="url(#ah)"/><path class="a" d="M400 98H468" marker-end="url(#ah)"/><path class="a" d="M470 122H402" marker-end="url(#ah)"/><text class="os" x="205" y="88" text-anchor="middle">UDP</text><text class="os" x="435" y="88" text-anchor="middle">UDP</text><text class="s" x="320" y="200" text-anchor="middle">each box is a separate process; can run on separate machines</text></svg>