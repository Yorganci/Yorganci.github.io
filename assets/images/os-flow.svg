<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 210" role="img" aria-label="Trace events go to an event dispatcher, which updates process-control-block states and a fixed-partition memory table"><style>.b{fill:#fbfaf6;stroke:#16181c;stroke-width:1.5}.k{fill:#16181c}.t{font:600 13px "IBM Plex Mono",monospace;fill:#16181c}.s{font:400 11px "IBM Plex Mono",monospace;fill:#686c73}.w{font:600 13px "IBM Plex Mono",monospace;fill:#f3f0e8}.a{stroke:#16181c;stroke-width:1.5;fill:none}.o{stroke:#d9480f;stroke-width:1.5;fill:none;stroke-dasharray:4 3}.os{font:400 11px "IBM Plex Mono",monospace;fill:#b23a0b}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16181c"/></marker></defs><rect class="b" x="10" y="65" width="150" height="80" rx="4"/><text class="t" x="85" y="100" text-anchor="middle">TRACE FILE</text><text class="s" x="85" y="122" text-anchor="middle">CPU · SYSCALL · I/O</text><path class="a" d="M160 105H228" marker-end="url(#ah)"/><rect class="k" x="230" y="65" width="150" height="80" rx="4"/><text class="w" x="305" y="100" text-anchor="middle">DISPATCHER</text><text class="s" x="305" y="122" text-anchor="middle" style="fill:#bdb5a4">ISR · scheduler</text><path class="a" d="M380 105H410V45H448M410 105V165H448" /><path class="a" d="M440 45H448M440 165H448" marker-end="url(#ah)"/><rect class="b" x="450" y="12" width="160" height="66" rx="4"/><text class="t" x="530" y="40" text-anchor="middle">PCB STATES</text><text class="s" x="530" y="60" text-anchor="middle">ready · wait · run</text><rect class="b" x="450" y="132" width="160" height="66" rx="4"/><text class="t" x="530" y="160" text-anchor="middle">MEMORY TABLE</text><text class="s" x="530" y="180" text-anchor="middle">fixed partitions</text></svg>